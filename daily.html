<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f2f7;color:#1a1a2e}
.topbar{background:#1a1a2e;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:1px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{background:#2d3748;color:#e2e8f0;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer;font-weight:700}
.datenav button:hover:not(:disabled){background:#374151}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav select{background:#2d3748;color:#fff;border:1px solid #4a5568;border-radius:6px;padding:5px 10px;font-size:14px;font-weight:700}
.topbar .updated{margin-left:auto;font-size:11px;color:#94a3b8}
.main{padding:22px 28px;max-width:1200px;margin:0 auto}
.event-banner{background:#fef3c7;border:1px solid #fbbf24;color:#92400e;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:18px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #dde1ea;border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:3px solid #9ca3af}
.kpi.bg-total{border-top-color:#374151}.kpi.bg-ec{border-top-color:#8b5cf6}
.kpi.bg-store{border-top-color:#4b6bfb}.kpi.bg-profit{border-top-color:#059669}
.kpi .klabel{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.kpi .kvalue{font-size:22px;font-weight:800;color:#1a1a2e}
.kpi .kchg{font-size:12px;margin-top:4px;font-weight:600}
.up{color:#2563eb}.down{color:#dc2626}.neu{color:#888}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:20px}
.card{background:#fff;border:1px solid #dde1ea;border-radius:14px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:18px}
.card h3{font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;font-weight:700}
.card canvas{max-height:280px}
.stat-list{display:flex;flex-direction:column;gap:14px}
.stat .slabel{font-size:11px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat .sval{font-size:18px;font-weight:800;margin-top:2px}
.stat .ssub{font-size:11.5px;color:#666;margin-top:2px}
.pbar-track{background:#eef0f5;border-radius:8px;height:10px;overflow:hidden;margin-top:8px}
.pbar-fill{background:#2563eb;height:100%;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 10px;background:#f7f9fc;color:#666;font-weight:700;border-bottom:2px solid #e8eaf0;font-size:11.5px}
.tbl td{padding:8px 10px;border-bottom:1px solid #f0f2f7}
.empty{color:#aaa;font-size:13px;padding:10px 0}
@media (max-width:800px){.kpi-row{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>

    <div class="stat-list" id="statList"></div>
  </div>
  <div id="restockCard"></div>
</div>

const LATEST = "2026-09-10";
const WEEKDAY_JA = ['月','火','水','木','金','土','日'];

function fmtYen(v){ return (v===null||v===undefined) ? '―' : '¥'+Math.round(v).toLocaleString('en-US'); }
function fmtPct(v){ return (v===null||v===undefined) ? '―' : v.toFixed(1)+'%'; }
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const wd = WEEKDAY_JA[(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7];
  return `${y}年${m}月${d}日（${wd}）`;
}

const sel = document.getElementById('dateSelect');
[...DATES].reverse().forEach(d=>{
  const opt = document.createElement('option');
  opt.value = d; opt.textContent = dateLabel(d);
  sel.appendChild(opt);
});

function kpiCard(label, actual, planPct, lyPct, css){
  const planCls = (planPct||0) >= 100 ? 'up' : 'down';
  const lyCls = (lyPct||0) >= 100 ? 'up' : 'down';
  return `<div class="kpi ${css}">
    <div class="klabel">${label}</div>
    <div class="kvalue">${fmtYen(actual)}</div>
    <div class="kchg"><span class="${planCls}">計画比 ${fmtPct(planPct)}</span> ／ <span class="${lyCls}">前年比 ${fmtPct(lyPct)}</span></div>
  </div>`;
}

function renderReport(dateStr){
  const rep = HISTORY[dateStr] || {};
  const day = rep.day || {};
  const wtd = rep.week_to_date || {};
  const mtd = rep.month_to_date || {};
  const mplan = rep.month_plan || {};
  const mfore = rep.month_end_forecast || {};
  const restocks = (rep.restocks_arriving||[]).filter(r=>r.hinban||r.name);

  document.getElementById('eventBanner').innerHTML = day.event_this ? `<div class="event-banner">📌 ${day.event_this}</div>` : '';

  document.getElementById('kpiRow').innerHTML =
    kpiCard('総売上（実績）', day.total, day.vs_plan_total_pct, day.vs_ly_total_pct, 'bg-total') +
    kpiCard('EC売上', day.ec, day.vs_plan_ec_pct, day.vs_ly_ec_pct, 'bg-ec') +
    kpiCard('店舗売上', day.store, day.vs_plan_store_pct, day.vs_ly_store_pct, 'bg-store') +
    `<div class="kpi bg-profit">
      <div class="klabel">粗利（粗利率）</div>
      <div class="kvalue">${fmtYen(day.profit_total)}</div>
      <div class="kchg neu">粗利率 ${fmtPct(day.profit_rate_total)}（前年 ${fmtPct(day.ly_profit_rate)}）</div>
    </div>`;

  const mtdPct = mplan.total ? Math.max(0, Math.min(100, (mtd.total||0)/mplan.total*100)) : 0;
  const forePct = (mfore.pct||{}).total;
  document.getElementById('statList').innerHTML = `
    <div class="card"><div class="stat">
      <div class="slabel">今週累計（${rep.week_label||''}）</div>
      <div class="sval">${fmtYen(wtd.total)}</div>
      <div class="ssub">計画 ${fmtYen(wtd.plan_total)} ／ 前年 ${fmtYen(wtd.ly_total)}</div>
    </div></div>
    <div class="card"><div class="stat">
      <div class="slabel">月間累計実績</div>
      <div class="sval">${fmtYen(mtd.total)}</div>
      <div class="ssub">月間計画 ${fmtYen(mplan.total)}（進捗 ${mtdPct.toFixed(0)}%）</div>
      <div class="pbar-track"><div class="pbar-fill" style="width:${mtdPct.toFixed(0)}%"></div></div>
    </div></div>
    <div class="card"><div class="stat">
      <div class="slabel">月末着地見込み</div>
      <div class="sval">${fmtYen((mfore.value||{}).total)}</div>
      <div class="ssub">計画比 ${fmtPct(forePct)}</div>
    </div></div>`;

  document.getElementById('restockCard').innerHTML = restocks.length ? `<div class="card">
    <h3>入荷予定</h3>
    <table class="tbl"><thead><tr><th>品番</th><th>品名</th><th>入荷予定日</th></tr></thead><tbody>
    ${restocks.map(r=>`<tr><td>${r.hinban||''}</td><td>${r.name||''}</td><td>${r.wh_date||''}</td></tr>`).join('')}
    </tbody></table>
  </div>` : `<div class="card"><h3>入荷予定</h3><div class="empty">入荷予定なし</div></div>`;

  sel.value = dateStr;
  document.getElementById('prevBtn').disabled = DATES.indexOf(dateStr) <= 0;
  document.getElementById('nextBtn').disabled = DATES.indexOf(dateStr) >= DATES.length-1;
}

sel.addEventListener('change', ()=>renderReport(sel.value));
document.getElementById('prevBtn').addEventListener('click', ()=>{
  const i = DATES.indexOf(sel.value);
  if(i>0) renderReport(DATES[i-1]);
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const i = DATES.indexOf(sel.value);
  if(i<DATES.length-1) renderReport(DATES[i+1]);
});

if(LATEST) renderReport(LATEST);

new Chart(document.getElementById('trendChart'), {
  type: 'line',
  data: {
    labels: TREND.labels,
    datasets: [
      {label:'実績', data: TREND.actual, borderColor:'#2563eb', backgroundColor:'#2563eb', tension:.25, spanGaps:true},
      {label:'計画', data: TREND.plan, borderColor:'#9ca3af', borderDash:[4,4], backgroundColor:'#9ca3af', tension:.25, spanGaps:true},
      {label:'前年', data: TREND.ly, borderColor:'#f59e0b', backgroundColor:'#f59e0b', tension:.25, spanGaps:true},
    ]
  },
  options: {
    responsive:true,
    plugins:{legend:{position:'bottom'}},
    scales:{y:{ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}
  }
});
</script>
