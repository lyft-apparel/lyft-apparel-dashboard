<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYFT 日次速報</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f2f7;color:#1a1a2e}
.topbar{background:#1a1a2e;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:1px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{background:#2d3748;color:#e2e8f0;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer;font-weight:700}
.datenav button:hover:not(:disabled){background:#374151}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav select{background:#2d3748;color:#fff;border:1px solid #4a5568;border-radius:6px;padding:5px 10px;font-size:14px;font-weight:700}
.datenav{position:relative}
.cal-toggle{background:#2d3748;color:#e2e8f0;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer}
.cal-toggle:hover{background:#374151}
.cal-toggle.active{background:#2563eb;color:#fff}
.cal-pop{position:absolute;top:38px;left:0;background:#fff;color:#1a1a2e;border:1px solid #dde1ea;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;width:280px;z-index:50}
.cal-pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-pop-head button{background:#f0f2f7;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px}
.cal-pop-head button:hover{background:#e2e6ee}
.cal-pop-head .cal-ym{font-size:13px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-wd{font-size:10px;color:#aaa;text-align:center;font-weight:700;padding:2px 0}
.cal-cell{position:relative;text-align:center;font-size:12px;padding:6px 0;border-radius:6px;cursor:default;color:#ccc}
.cal-cell.has-data{color:#1a1a2e;cursor:pointer}
.cal-cell.has-data:hover{background:#f0f2f7}
.cal-cell.selected{background:#2563eb;color:#fff;font-weight:800}
.cal-cell.alert::after{content:'';position:absolute;top:2px;right:4px;width:6px;height:6px;border-radius:50%;background:#dc2626}
.cal-cell.selected.alert::after{background:#fecaca}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#888;margin-top:10px}
.cal-legend .dot{width:6px;height:6px;border-radius:50%;background:#dc2626;display:inline-block}
.topbar .updated{margin-left:auto;font-size:11px;color:#94a3b8}
.main{padding:22px 28px;max-width:1300px;margin:0 auto}
.event-banner{background:#fef3c7;border:1px solid #fbbf24;color:#92400e;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:18px;display:flex;flex-direction:column;gap:4px}
.forecast-banner{background:#fee2e2;border:1.5px solid #dc2626;color:#991b1b;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:18px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #dde1ea;border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:3px solid #9ca3af}
.kpi.bg-total{border-top-color:#374151}.kpi.bg-ec{border-top-color:#8b5cf6}
.kpi.bg-store{border-top-color:#4b6bfb}.kpi.bg-profit{border-top-color:#059669}
.kpi .klabel{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.kpi .kvalue{font-size:22px;font-weight:800;color:#1a1a2e}
.kpi .kchg{font-size:12px;margin-top:4px;font-weight:600}
.up{color:#2563eb}.down{color:#dc2626}.neu{color:#888}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:20px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.card{background:#fff;border:1px solid #dde1ea;border-radius:14px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:18px}
.card h3{font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;font-weight:700}
.card canvas{max-height:280px}
.stat-list{display:flex;flex-direction:column;gap:14px}
.stat .slabel{font-size:11px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat .sval{font-size:18px;font-weight:800;margin-top:2px}
.stat .ssub{font-size:11.5px;color:#666;margin-top:2px}
.stat .sbreak{font-size:11px;color:#888;margin-top:6px;display:flex;gap:12px}
.pbar-track{background:#eef0f5;border-radius:8px;height:10px;overflow:hidden;margin-top:8px}
.pbar-fill{background:#2563eb;height:100%;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;padding:7px 9px;background:#f7f9fc;color:#666;font-weight:700;border-bottom:2px solid #e8eaf0;font-size:11px;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 9px;border-bottom:1px solid #f0f2f7;text-align:right;white-space:nowrap}
.tbl td:first-child{text-align:left;font-weight:600;color:#444}
.tbl tr:last-child td{border-bottom:none}
.empty{color:#aaa;font-size:13px;padding:10px 0}
.margin-alert{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d;padding:14px 18px;border-radius:10px;margin-bottom:18px}
.margin-alert .ma-title{font-size:13.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.margin-alert .ma-segs{display:flex;gap:14px;font-size:12.5px;margin-bottom:10px;flex-wrap:wrap}
.margin-alert .ma-segs b{font-weight:800}
.margin-alert ul{margin:0 0 6px 20px;font-size:12.5px;line-height:1.6}
.margin-alert .ma-meta{font-size:10.5px;color:#9f1239;margin-top:6px}
.ma-drilldown{background:#fff;border:1px solid #fecaca;border-radius:8px;padding:14px 16px;margin-top:10px}
.ma-drilldown-title{font-size:12.5px;color:#7f1d1d;margin-bottom:10px}
.ma-drilldown-title b{font-weight:800}
.ma-drilldown-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ma-sub{font-size:10.5px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 6px}
.ma-sub:first-child{margin-top:0}
.ma-cat-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #fef2f2}
.ma-cat-row .diffpos{color:#dc2626;font-weight:700}
.ma-cat-row .diffneg{color:#2563eb;font-weight:700}
.ma-item-row{font-size:11.5px;padding:3px 0;border-bottom:1px solid #fef2f2;color:#444}
.ma-item-row b{color:#1a1a2e}
.ma-caveat{font-size:10.5px;color:#9f1239;margin-top:10px;line-height:1.5}
@media (max-width:700px){.ma-drilldown-grid{grid-template-columns:1fr}}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.grid2,.grid2b{grid-template-columns:1fr}}
</style>
</head>

function fmtYen(v){ return (v===null||v===undefined) ? '―' : '¥'+Math.round(v).toLocaleString('en-US'); }
function fmtPct(v){ return (v===null||v===undefined) ? '―' : v.toFixed(1)+'%'; }
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const wd = WEEKDAY_JA[(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7];
  return `${y}年${m}月${d}日（${wd}）`;
}

[...DATES].reverse().forEach(d=>{

  const alerted = (HISTORY[d]||{}).margin_alert && (HISTORY[d]||{}).margin_alert.triggered;
  opt.value = d; opt.textContent = (alerted ? '⚠️ ' : '') + dateLabel(d);
  sel.appendChild(opt);
});

function kpiCard(label, actual, planPct, lyPct, css){
  const planCls = (planPct||0) >= 100 ? 'up' : 'down';
  const lyCls = (lyPct||0) >= 100 ? 'up' : 'down';
  return `<div class="kpi ${css}">
    <div class="klabel">${label}</div>
    <div class="kvalue">${fmtYen(actual)}</div>
    <div class="kchg"><span class="${planCls}">計画比 ${fmtPct(planPct)}</span> ／ <span class="${lyCls}">前年比 ${fmtPct(lyPct)}</span></div>
  </div>`;
}

function salesRow(label, actual, plan, planPct, ly, lyPct){
  const planCls = (planPct||0) >= 100 ? 'up' : 'down';
  const lyCls = (lyPct||0) >= 100 ? 'up' : 'down';
  return `<tr><td>${label}</td><td>${fmtYen(actual)}</td><td>${fmtYen(plan)}</td>
    <td class="${planCls}">${fmtPct(planPct)}</td><td>${fmtYen(ly)}</td>
    <td class="${lyCls}">${fmtPct(lyPct)}</td></tr>`;
}

function profitRow(label, actual, rate, ly, lyRate){
  return `<tr><td>${label}</td><td>${fmtYen(actual)}</td><td>${fmtPct(rate)}</td>
    <td>${fmtYen(ly)}</td><td>${fmtPct(lyRate)}</td></tr>`;
}

function renderReport(dateStr){
  const rep = HISTORY[dateStr] || {};
  const day = rep.day || {};
  const wtd = rep.week_to_date || {};
  const mtd = rep.month_to_date || {};

  const mfore = rep.month_end_forecast || {};
  const restocks = (rep.restocks_arriving||[]).filter(r=>r.hinban||r.name);

  const events = [];
  if(day.event_this) events.push(`<div>📌 今期: ${day.event_this}</div>`);
  if(day.event_ly) events.push(`<div>🗓 前年: ${day.event_ly}</div>`);
  document.getElementById('eventBanner').innerHTML = events.length ? `<div class="event-banner">${events.join('')}</div>` : '';

  // 2026-09-17: シート側でEC/店舗実績がまだ手入力されておらず予測式のままの
  // 日は、表示中の数値が確定実績ではないことを一目でわかるようにする
  // （過去にこれに気づかず誤った数値を報告してしまった事故の再発防止）。
  const fcParts = [];
  if(day.ec_is_forecast) fcParts.push('EC');
  if(day.store_is_forecast) fcParts.push('店舗');
  document.getElementById('forecastBanner').innerHTML = fcParts.length
    ? `<div class="forecast-banner">⚠️ この日の${fcParts.join('・')}実績はシート未入力のため予測値（前年実績×想定成長率）で表示中。実績確定後、自動更新で正しい値に置き換わります。</div>`
    : '';

  // 2026-10-22: Shopify実原価によるEC粗利率の要因分解（商品構成/値引き/良品交換/返品）
  function renderCostFactors(cf){
    if(!cf) return '';
    const labels = {mix:'商品構成（原価率）', discount:'値引き', exchange:'良品交換', returns:'返品'};
    const effRows = Object.entries(cf.effects_pt||{}).map(([k,v])=>{
      const cls = v < -0.05 ? 'diffpos' : (v > 0.05 ? 'diffneg' : '');
      const mark = k === cf.main_factor ? ' ◀ 主因' : '';
      return `<div class="ma-cat-row"><span>${labels[k]||k}</span><span class="${cls}">${v>=0?'+':''}${v.toFixed(1)}pt${mark}</span></div>`;
    }).join('');
    const t = cf.today||{}, b = cf.baseline||{};
    const exch = (t.exchange_orders||[]).length
      ? `<div class="ma-item-row">良品交換 ${t.exchange_orders.length}件（原価¥${Math.round(t.exchange_cogs).toLocaleString()}）: ${t.exchange_orders.join(' ')}</div>` : '';
    const prodRows = (cf.top_products||[]).map(p=>
      `<div class="ma-item-row"><b>${p.name}</b> [${p.type}] ${p.qty}点 原価率${p.cost_rate.toFixed(1)}% 超過原価+¥${Math.round(p.excess_cost).toLocaleString()}</div>`

    const typeRows = (cf.type_shift||[]).map(s=>{
      const d = s.today_share - s.base_share;
      const cls = d > 0 ? 'diffpos' : 'diffneg';
      const cr = s.today_cost_rate==null ? '-' : s.today_cost_rate.toFixed(1)+'%';
      return `<div class="ma-cat-row"><span>${s.type}（原価率${cr}）</span>
        <span>${s.today_share.toFixed(1)}% <span class="${cls}">(基準${s.base_share.toFixed(1)}% ${d>0?'+':''}${d.toFixed(1)}pt)</span></span></div>`;

    return `<div class="ma-drilldown">

          <div class="ma-item-row">定価ベース原価率 ${t.cost_rate.toFixed(1)}%（基準${b.cost_rate.toFixed(1)}%）／ 値引率 ${t.discount_rate.toFixed(1)}%（基準${b.discount_rate.toFixed(1)}%）</div>

          ${typeRows}

    </div>`;
  }

    return `<div class="ma-drilldown">
      <div class="ma-drilldown-title">🔎 ${label}商品レベル深掘り分析: <b>${dd.headline}</b></div>
      <div class="ma-drilldown-grid">
        <div>
          <div class="ma-sub">カテゴリ構成比の変化（直近${dd.baseline_days}日平均比）</div>
          ${catRows}
        </div>
        <div>
          <div class="ma-sub">値引き/セール価格の可能性があるSKU（影響額合計 ${fmtYen(dd.price_drop.total_impact)}、売上比${fmtPct(dd.price_drop.pct_of_sales)}）</div>
          ${priceItems}
          <div class="ma-sub">新規/低頻度SKU（売上の${fmtPct(dd.new_items.pct_of_sales)}）</div>
          ${newItems}
        </div>
      </div>
      <div class="ma-caveat">${(dd.caveats||[]).map(c=>'※ '+c).join('<br>')}</div>
    </div>`;
  }

  const ma = rep.margin_alert;
  if(ma && ma.triggered){
    const exAdj = (ma.exchange||{}).segments_ex_exchange || {};
    const segLine = Object.entries(ma.segments||{}).map(([k,v])=>{
      const isBreached = (ma.breached||[]).includes(k);
      const adj = (exAdj[k]!=null && k!=='店舗') ? `<span style="font-weight:400">（良品交換除く ${fmtPct(exAdj[k])}）</span>` : '';
      return `<span>${k}: <b style="${isBreached?'color:#dc2626':''}">${fmtPct(v)}</b>${adj}</span>`;
    }).join('');

    const drilldownHtml = renderCostFactors(ma.ec_cost_factors) + renderDrilldown(ma.ec_drilldown, 'EC') + renderDrilldown(ma.store_drilldown, '店舗');

    document.getElementById('marginAlert').innerHTML = `<div class="margin-alert">
      <div class="ma-title">⚠️ 粗利率アラート（閾値 ${ma.threshold}% 未満: ${(ma.breached||[]).join('・')}）</div>
      <div class="ma-segs">${segLine}</div>
      <ul>${(ma.factors||[]).map(f=>`<li>${f}</li>`).join('')}</ul>
      <div class="ma-meta">要因分析: ${ma.analyzed_at||''} 時点（自動分析・要人的確認）</div>
      ${drilldownHtml}
    </div>`;
  } else if(ma && (ma.suppressed_by_exchange||[]).length){
    // 2026-10-22: シート上は閾値割れだが、良品交換分を除くと閾値以上 → アラートにしない
    const ex = ma.exchange||{}, adj = ex.segments_ex_exchange||{};
    const parts = ma.suppressed_by_exchange.map(k=>`${k} ${fmtPct((ma.segments||{})[k])} → ${fmtPct(adj[k])}`).join('、');
    document.getElementById('marginAlert').innerHTML = `<div class="event-banner">ℹ️ 粗利率はシート上 閾値${ma.threshold}%未満（${parts}）ですが、良品交換（不良品・サイズ交換、原価¥${Math.round(ex.cogs||0).toLocaleString()}）を除くと閾値以上のためアラート対象外。</div>`;
  } else {
    document.getElementById('marginAlert').innerHTML = '';
  }

  document.getElementById('kpiRow').innerHTML =
    kpiCard('総売上（実績）', day.total, day.vs_plan_total_pct, day.vs_ly_total_pct, 'bg-total') +
    kpiCard('EC売上', day.ec, day.vs_plan_ec_pct, day.vs_ly_ec_pct, 'bg-ec') +
    kpiCard('店舗売上', day.store, day.vs_plan_store_pct, day.vs_ly_store_pct, 'bg-store') +
    `<div class="kpi bg-profit">
      <div class="klabel">粗利（粗利率）</div>
      <div class="kvalue">${fmtYen(day.profit_total)}</div>
      <div class="kchg neu">粗利率 ${fmtPct(day.profit_rate_total)}（前年 ${fmtPct(day.ly_profit_rate)}）</div>
    </div>`;

  const mtdPct = mplan.total ? Math.max(0, Math.min(100, (mtd.total||0)/mplan.total*100)) : 0;
  const forePct = (mfore.pct||{}).total;
  document.getElementById('statList').innerHTML = `
    <div class="card"><div class="stat">
      <div class="slabel">今週累計（${rep.week_label||''}）</div>
      <div class="sval">${fmtYen(wtd.total)}</div>
      <div class="ssub">計画 ${fmtYen(wtd.plan_total)} ／ 前年 ${fmtYen(wtd.ly_total)}</div>
      <div class="sbreak"><span>EC ${fmtYen(wtd.ec)}</span><span>店舗 ${fmtYen(wtd.store)}</span></div>
    </div></div>
    <div class="card"><div class="stat">
      <div class="slabel">月間累計実績</div>
      <div class="sval">${fmtYen(mtd.total)}</div>
      <div class="ssub">月間計画 ${fmtYen(mplan.total)}（進捗 ${mtdPct.toFixed(0)}%）</div>
      <div class="pbar-track"><div class="pbar-fill" style="width:${mtdPct.toFixed(0)}%"></div></div>
      <div class="sbreak"><span>EC ${fmtYen(mtd.ec)}（計画${fmtYen(mplan.ec)}）</span><span>店舗 ${fmtYen(mtd.store)}（計画${fmtYen(mplan.store)}）</span></div>
    </div></div>
    <div class="card"><div class="stat">
      <div class="slabel">月末着地見込み</div>
      <div class="sval">${fmtYen((mfore.value||{}).total)}</div>
      <div class="ssub">計画比 ${fmtPct(forePct)}</div>
      <div class="sbreak"><span>EC ${fmtYen((mfore.value||{}).ec)}（${fmtPct((mfore.pct||{}).ec)}）</span><span>店舗 ${fmtYen((mfore.value||{}).store)}（${fmtPct((mfore.pct||{}).store)}）</span></div>
    </div></div>`;

  document.getElementById('salesTbl').innerHTML =
    `<thead><tr><th>区分</th><th>今期実績</th><th>計画</th><th>計画比</th><th>前年実績</th><th>前年比</th></tr></thead><tbody>` +
    salesRow('計', day.total, day.plan_total, day.vs_plan_total_pct, day.ly_total, day.vs_ly_total_pct) +
    salesRow('EC', day.ec, day.ec_plan, day.vs_plan_ec_pct, day.ly_ec, day.vs_ly_ec_pct) +
    salesRow('店舗', day.store, day.store_plan_apr92, day.vs_plan_store_pct, day.ly_store, day.vs_ly_store_pct) +
    `</tbody>`;

  document.getElementById('profitTbl').innerHTML =
    `<thead><tr><th>区分</th><th>今期実績</th><th>粗利率</th><th>前年実績</th><th>前年粗利率</th></tr></thead><tbody>` +
    profitRow('計', day.profit_total, day.profit_rate_total, day.ly_profit_total, day.ly_profit_rate) +
    profitRow('EC', day.profit_ec, day.profit_rate_ec, day.ly_profit_ec, null) +
    profitRow('店舗', day.profit_store, day.profit_rate_store, day.ly_profit_store, null) +
    `</tbody>`;

  document.getElementById('genderTbl').innerHTML =
    `<thead><tr><th>区分</th><th>男性(M)</th><th>女性(W)</th><th>合計</th></tr></thead><tbody>` +
    `<tr><td>計</td><td>${fmtYen(day.gym_incl_m_total)}</td><td>${fmtYen(day.gym_incl_w_total)}</td><td>${fmtYen(day.gym_incl_total)}</td></tr>` +
    `<tr><td>EC</td><td>${fmtYen(day.gym_incl_m_ec)}</td><td>${fmtYen(day.gym_incl_w_ec)}</td><td>${fmtYen((day.gym_incl_m_ec||0)+(day.gym_incl_w_ec||0))}</td></tr>` +
    `<tr><td>店舗</td><td>${fmtYen(day.gym_incl_m_store)}</td><td>${fmtYen(day.gym_incl_w_store)}</td><td>${fmtYen((day.gym_incl_m_store||0)+(day.gym_incl_w_store||0))}</td></tr>` +
    `</tbody>`;

  document.getElementById('restockCard').innerHTML = restocks.length ? `<div class="card">
    <h3>入荷予定</h3>
    <table class="tbl" style="font-size:13px"><thead><tr><th style="text-align:left">品番</th><th style="text-align:left">品名</th><th>入荷予定日</th></tr></thead><tbody>
    ${restocks.map(r=>`<tr><td style="text-align:left;font-weight:400;color:#1a1a2e">${r.hinban||''}</td><td style="text-align:left;font-weight:400;color:#1a1a2e">${r.name||''}</td><td>${r.wh_date||''}</td></tr>`).join('')}
    </tbody></table>
  </div>` : `<div class="card"><h3>入荷予定</h3><div class="empty">入荷予定なし</div></div>`;

  sel.value = dateStr;
  document.getElementById('prevBtn').disabled = DATES.indexOf(dateStr) <= 0;
  document.getElementById('nextBtn').disabled = DATES.indexOf(dateStr) >= DATES.length-1;
}

sel.addEventListener('change', ()=>renderReport(sel.value));
document.getElementById('prevBtn').addEventListener('click', ()=>{
  const i = DATES.indexOf(sel.value);
  if(i>0) renderReport(DATES[i-1]);
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const i = DATES.indexOf(sel.value);
  if(i<DATES.length-1) renderReport(DATES[i+1]);
});

// ─── カレンダー（アラート発生日に赤丸） ───────────────────────────
function pad2(n){ return String(n).padStart(2,'0'); }
let calMonth = null; // {y, m}: 表示中の年月（月移動時のみ選択日から独立）

function renderCalendar(selectedDate){
  if(!calMonth){
    const [y,m] = selectedDate.split('-').map(Number);
    calMonth = {y, m};
  }
  const y = calMonth.y, m = calMonth.m;
  const first = new Date(Date.UTC(y, m-1, 1));
  const startOffset = (first.getUTCDay()+6)%7; // 月曜始まり
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const wdRow = WEEKDAY_JA.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div class="cal-cell"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${pad2(m)}-${pad2(d)}`;
    const rep = HISTORY[iso];
    const hasData = !!rep;
    const alerted = rep && rep.margin_alert && rep.margin_alert.triggered;
    const cls = ['cal-cell'];
    if(hasData) cls.push('has-data');
    if(alerted) cls.push('alert');
    if(iso === selectedDate) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" ${hasData?`data-date="${iso}"`:''}>${d}</div>`;
  }
  document.getElementById('calPop').innerHTML = `
    <div class="cal-pop-head">
      <button data-action="prev">◀</button>
      <div class="cal-ym">${y}年${m}月</div>
      <button data-action="next">▶</button>
    </div>
    <div class="cal-grid">${wdRow}${cells}</div>
    <div class="cal-legend"><span class="dot"></span> 粗利率アラート発生日</div>
  `;
}

const calToggle = document.getElementById('calToggle');
const calPop = document.getElementById('calPop');
function closeCal(){ calPop.hidden = true; calToggle.classList.remove('active'); }
calToggle.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(calPop.hidden){
    calMonth = null;
    renderCalendar(sel.value);
    calPop.hidden = false;
    calToggle.classList.add('active');
  } else {
    closeCal();
  }
});
calPop.addEventListener('click', (e)=>{
  e.stopPropagation();
  const dayCell = e.target.closest('[data-date]');
  if(dayCell){ renderReport(dayCell.dataset.date); closeCal(); return; }
  const navBtn = e.target.closest('[data-action]');
  if(navBtn){
    if(navBtn.dataset.action === 'prev'){ calMonth.m--; if(calMonth.m<1){calMonth.m=12; calMonth.y--;} }
    else { calMonth.m++; if(calMonth.m>12){calMonth.m=1; calMonth.y++;} }
    renderCalendar(sel.value);
  }
});
document.addEventListener('click', ()=>{ if(!calPop.hidden) closeCal(); });

if(LATEST) renderReport(LATEST);

new Chart(document.getElementById('trendChart'), {
  type: 'line',
  data: {
    labels: TREND.labels,
    datasets: [
      {label:'実績', data: TREND.actual, borderColor:'#2563eb', backgroundColor:'#2563eb', tension:.25, spanGaps:true},
      {label:'計画', data: TREND.plan, borderColor:'#9ca3af', borderDash:[4,4], backgroundColor:'#9ca3af', tension:.25, spanGaps:true},
      {label:'前年', data: TREND.ly, borderColor:'#f59e0b', backgroundColor:'#f59e0b', tension:.25, spanGaps:true},
    ]
  },
  options: {
    responsive:true,
    plugins:{legend:{position:'bottom'}},
    scales:{y:{ticks:{callback:v=>'¥'+(v/1000).toFixed(0)+'k'}}}
  }
});
</script>
