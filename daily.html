<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f2f7;color:#1a1a2e}
.topbar{background:#1a1a2e;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:1px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{background:#2d3748;color:#e2e8f0;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer;font-weight:700}
.datenav button:hover:not(:disabled){background:#374151}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav select{background:#2d3748;color:#fff;border:1px solid #4a5568;border-radius:6px;padding:5px 10px;font-size:14px;font-weight:700}
.datenav{position:relative}
.cal-toggle{background:#2d3748;color:#e2e8f0;border:none;border-radius:6px;width:28px;height:28px;font-size:14px;cursor:pointer}
.cal-toggle:hover{background:#374151}
.cal-toggle.active{background:#2563eb;color:#fff}
.cal-pop{position:absolute;top:38px;left:0;background:#fff;color:#1a1a2e;border:1px solid #dde1ea;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;width:280px;z-index:50}
.cal-pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-pop-head button{background:#f0f2f7;border:none;border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px}
.cal-pop-head button:hover{background:#e2e6ee}
.cal-pop-head .cal-ym{font-size:13px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-wd{font-size:10px;color:#aaa;text-align:center;font-weight:700;padding:2px 0}
.cal-cell{position:relative;text-align:center;font-size:12px;padding:6px 0;border-radius:6px;cursor:default;color:#ccc}
.cal-cell.has-data{color:#1a1a2e;cursor:pointer}
.cal-cell.has-data:hover{background:#f0f2f7}
.cal-cell.selected{background:#2563eb;color:#fff;font-weight:800}
.cal-cell.alert::after{content:'';position:absolute;top:2px;right:4px;width:6px;height:6px;border-radius:50%;background:#dc2626}
.cal-cell.selected.alert::after{background:#fecaca}
.cal-legend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#888;margin-top:10px}
.cal-legend .dot{width:6px;height:6px;border-radius:50%;background:#dc2626;display:inline-block}
.topbar .updated{margin-left:auto;font-size:11px;color:#94a3b8}
.main{padding:22px 28px;max-width:1300px;margin:0 auto}
.event-banner{background:#fef3c7;border:1px solid #fbbf24;color:#92400e;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:18px;display:flex;flex-direction:column;gap:4px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #dde1ea;border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);border-top:3px solid #9ca3af}
.kpi.bg-total{border-top-color:#374151}.kpi.bg-ec{border-top-color:#8b5cf6}
.kpi.bg-store{border-top-color:#4b6bfb}.kpi.bg-profit{border-top-color:#059669}
.kpi .klabel{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.kpi .kvalue{font-size:22px;font-weight:800;color:#1a1a2e}
.kpi .kchg{font-size:12px;margin-top:4px;font-weight:600}
.up{color:#2563eb}.down{color:#dc2626}.neu{color:#888}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:20px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.card{background:#fff;border:1px solid #dde1ea;border-radius:14px;padding:22px;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:18px}
.card h3{font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;font-weight:700}
.card canvas{max-height:280px}
.stat-list{display:flex;flex-direction:column;gap:14px}
.stat .slabel{font-size:11px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat .sval{font-size:18px;font-weight:800;margin-top:2px}
.stat .ssub{font-size:11.5px;color:#666;margin-top:2px}
.stat .sbreak{font-size:11px;color:#888;margin-top:6px;display:flex;gap:12px}
.pbar-track{background:#eef0f5;border-radius:8px;height:10px;overflow:hidden;margin-top:8px}
.pbar-fill{background:#2563eb;height:100%;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:right;padding:7px 9px;background:#f7f9fc;color:#666;font-weight:700;border-bottom:2px solid #e8eaf0;font-size:11px;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 9px;border-bottom:1px solid #f0f2f7;text-align:right;white-space:nowrap}
.tbl td:first-child{text-align:left;font-weight:600;color:#444}
.tbl tr:last-child td{border-bottom:none}
.empty{color:#aaa;font-size:13px;padding:10px 0}
.margin-alert{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d;padding:14px 18px;border-radius:10px;margin-bottom:18px}
.margin-alert .ma-title{font-size:13.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.margin-alert .ma-segs{display:flex;gap:14px;font-size:12.5px;margin-bottom:10px;flex-wrap:wrap}
.margin-alert .ma-segs b{font-weight:800}
.margin-alert ul{margin:0 0 6px 20px;font-size:12.5px;line-height:1.6}
.margin-alert .ma-meta{font-size:10.5px;color:#9f1239;margin-top:6px}
.ma-drilldown{background:#fff;border:1px solid #fecaca;border-radius:8px;padding:14px 16px;margin-top:10px}
.ma-drilldown-title{font-size:12.5px;color:#7f1d1d;margin-bottom:10px}
.ma-drilldown-title b{font-weight:800}
.ma-drilldown-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ma-sub{font-size:10.5px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 6px}
.ma-sub:first-child{margin-top:0}
.ma-cat-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #fef2f2}
.ma-cat-row .diffpos{color:#dc2626;font-weight:700}
.ma-cat-row .diffneg{color:#2563eb;font-weight:700}
.ma-item-row{font-size:11.5px;padding:3px 0;border-bottom:1px solid #fef2f2;color:#444}
.ma-item-row b{color:#1a1a2e}
.ma-caveat{font-size:10.5px;color:#9f1239;margin-top:10px;line-height:1.5}
@media (max-width:700px){.ma-drilldown-grid{grid-template-columns:1fr}}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.grid2,.grid2b{grid-template-columns:1fr}}

function fmtYen(v){ return (v===null||v===undefined) ? '―' : '¥'+Math.round(v).toLocaleString('en-US'); }
function fmtPct(v){ return (v===null||v===undefined) ? '―' : v.toFixed(1)+'%'; }
function dateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const wd = WEEKDAY_JA[(new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7];
  return `${y}年${m}月${d}日（${wd}）`;
}

function kpiCard(label, actual, planPct, lyPct, css){
  const planCls = (planPct||0) >= 100 ? 'up' : 'down';
  const lyCls = (lyPct||0) >= 100 ? 'up' : 'down';
  return `<div class="kpi ${css}">
    <div class="klabel">${label}</div>
    <div class="kvalue">${fmtYen(actual)}</div>
    <div class="kchg"><span class="${planCls}">計画比 ${fmtPct(planPct)}</span> ／ <span class="${lyCls}">前年比 ${fmtPct(lyPct)}</span></div>
  </div>`;
}

function salesRow(label, actual, plan, planPct, ly, lyPct){
  const planCls = (planPct||0) >= 100 ? 'up' : 'down';
  const lyCls = (lyPct||0) >= 100 ? 'up' : 'down';
  return `<tr><td>${label}</td><td>${fmtYen(actual)}</td><td>${fmtYen(plan)}</td>
    <td class="${planCls}">${fmtPct(planPct)}</td><td>${fmtYen(ly)}</td>
    <td class="${lyCls}">${fmtPct(lyPct)}</td></tr>`;
}

function profitRow(label, actual, rate, ly, lyRate){
  return `<tr><td>${label}</td><td>${fmtYen(actual)}</td><td>${fmtPct(rate)}</td>
    <td>${fmtYen(ly)}</td><td>${fmtPct(lyRate)}</td></tr>`;
}

// ─── カレンダー（アラート発生日に赤丸） ───────────────────────────
function pad2(n){ return String(n).padStart(2,'0'); }
let calMonth = null; // {y, m}: 表示中の年月（月移動時のみ選択日から独立）

function renderCalendar(selectedDate){
  if(!calMonth){
    const [y,m] = selectedDate.split('-').map(Number);
    calMonth = {y, m};
  }
  const y = calMonth.y, m = calMonth.m;
  const first = new Date(Date.UTC(y, m-1, 1));
  const startOffset = (first.getUTCDay()+6)%7; // 月曜始まり
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const wdRow = WEEKDAY_JA.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += '<div class="cal-cell"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${pad2(m)}-${pad2(d)}`;
    const rep = HISTORY[iso];
    const hasData = !!rep;
    const alerted = rep && rep.margin_alert && rep.margin_alert.triggered;
    const cls = ['cal-cell'];
    if(hasData) cls.push('has-data');
    if(alerted) cls.push('alert');
    if(iso === selectedDate) cls.push('selected');
    cells += `<div class="${cls.join(' ')}" ${hasData?`data-date="${iso}"`:''}>${d}</div>`;
  }
  document.getElementById('calPop').innerHTML = `
    <div class="cal-pop-head">
      <button data-action="prev">◀</button>
      <div class="cal-ym">${y}年${m}月</div>
      <button data-action="next">▶</button>
    </div>
    <div class="cal-grid">${wdRow}${cells}</div>
    <div class="cal-legend"><span class="dot"></span> 粗利率アラート発生日</div>
  `;
}

const calToggle = document.getElementById('calToggle');
const calPop = document.getElementById('calPop');
function closeCal(){ calPop.hidden = true; calToggle.classList.remove('active'); }
calToggle.addEventListener('click', (e)=>{
  e.stopPropagation();
  if(calPop.hidden){
    calMonth = null;
    renderCalendar(sel.value);
    calPop.hidden = false;
    calToggle.classList.add('active');
  } else {
    closeCal();
  }
});
calPop.addEventListener('click', (e)=>{
  e.stopPropagation();
  const dayCell = e.target.closest('[data-date]');
  if(dayCell){ renderReport(dayCell.dataset.date); closeCal(); return; }
  const navBtn = e.target.closest('[data-action]');
  if(navBtn){
    if(navBtn.dataset.action === 'prev'){ calMonth.m--; if(calMonth.m<1){calMonth.m=12; calMonth.y--;} }
    else { calMonth.m++; if(calMonth.m>12){calMonth.m=1; calMonth.y++;} }
    renderCalendar(sel.value);
  }
});
document.addEventListener('click', ()=>{ if(!calPop.hidden) closeCal(); });
